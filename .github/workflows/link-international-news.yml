name: Link international news coverage

on:
  # Agendamento pausado a pedido do usuário — job de IA (embeddings +
  # tradução) fica disponível só sob disparo manual até ser reativado.
  # schedule:
  #   - cron: "15 */3 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: international-news-linking
  cancel-in-progress: false

jobs:
  link-international:
    name: Match stories across countries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PRODUCTION_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Validate workflow secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PRODUCTION_SITE_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: PRODUCTION_SITE_URL"
            exit 1
          fi

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          if [[ "${PRODUCTION_SITE_URL}" != https://* ]]; then
            echo "::error::PRODUCTION_SITE_URL must start with https://"
            exit 1
          fi

      - name: Trigger international story matching
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="${PRODUCTION_SITE_URL%/}"
          RESPONSE_FILE="${RUNNER_TEMP}/link-international.json"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --request POST \
              --connect-timeout 20 \
              --max-time 360 \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              "${BASE_URL}/api/internal/stories/link-international"
          )"

          cat "${RESPONSE_FILE}"

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            echo "::error::International linking failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          node - "${RESPONSE_FILE}" <<'NODE'
          const fs = require("node:fs");

          const filePath = process.argv[2];
          const payload = JSON.parse(
            fs.readFileSync(
              filePath,
              "utf8",
            ),
          );

          if (payload.ok !== true) {
            throw new Error(
              `International linking failed: ${JSON.stringify(payload)}`,
            );
          }

          const result = payload.result ?? {};

          console.log(
            [
              "International linking completed.",
              `Window stories: ${result.windowStories ?? "unknown"}.`,
              `Embeddings computed: ${result.embeddingsComputed ?? "unknown"}.`,
              `Candidate pairs: ${result.candidatePairs ?? "unknown"}.`,
              `Links created: ${result.linksCreated ?? "unknown"}.`,
              `Translations created: ${result.translationsCreated ?? "unknown"}.`,
            ].join(" "),
          );
          NODE
