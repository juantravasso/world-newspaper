name: Extract news from no-RSS sources with AI

on:
  # Aguardando aprovação de cadência — ver custo estimado no PR/commit.
  # schedule:
  #   - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-source-extraction
  cancel-in-progress: false

jobs:
  extract-ai-sources:
    name: Extract headlines from sources without RSS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PRODUCTION_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Validate workflow secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PRODUCTION_SITE_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: PRODUCTION_SITE_URL"
            exit 1
          fi

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          if [[ "${PRODUCTION_SITE_URL}" != https://* ]]; then
            echo "::error::PRODUCTION_SITE_URL must start with https://"
            exit 1
          fi

      - name: Trigger AI source extraction
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="${PRODUCTION_SITE_URL%/}"
          RESPONSE_FILE="${RUNNER_TEMP}/extract-ai-sources.json"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --request POST \
              --connect-timeout 20 \
              --max-time 280 \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              "${BASE_URL}/api/internal/stories/extract-ai-sources"
          )"

          cat "${RESPONSE_FILE}"

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            echo "::error::AI source extraction failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          node - "${RESPONSE_FILE}" <<'NODE'
          const fs = require("node:fs");

          const filePath = process.argv[2];
          const payload = JSON.parse(
            fs.readFileSync(
              filePath,
              "utf8",
            ),
          );

          if (payload.ok !== true) {
            throw new Error(
              `AI source extraction failed: ${JSON.stringify(payload)}`,
            );
          }

          const result = payload.result ?? {};

          console.log(
            [
              "AI source extraction completed.",
              `Sources processed: ${result.sourcesProcessed ?? "unknown"}.`,
              `Links scraped: ${result.linksScraped ?? "unknown"}.`,
              `Articles extracted: ${result.articlesExtracted ?? "unknown"}.`,
              `Stories saved: ${result.storiesSaved ?? "unknown"}.`,
            ].join(" "),
          );
          NODE
